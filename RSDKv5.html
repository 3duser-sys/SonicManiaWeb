<html lang="en-us">
        <head>
                <meta charset="utf-8" />

                <title>Sonic Mania</title>

                <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />

                <link type="text/css" rel="stylesheet" href="css/fonts.css" />
                <style type="text/css">
                        html, body {
                                font-family: arial, sans-serif;
                                margin: 0;
                                padding: 0;
                                width: 100%;
                                height: 100%;
                                overflow: hidden;
                                background-color: #000;
                                text-align: center;
                        }

                        /*noinspection CssInvalidPropertyValue,CssOverwrittenProperties*/
                        canvas {
                                height: 100%;
                                margin: auto;
                                padding: 0;
                                border: 0 none;
                                background-color: #000;
                                -ms-interpolation-mode: nearest-neighbor;
                                image-rendering: optimizeSpeed;
                                image-rendering: -webkit-optimize-contrast;
                                image-rendering: -moz-crisp-edges;
                                image-rendering: -o-crisp-edges;
                                image-rendering: crisp-edges;
                                image-rendering: pixelated;
                        }

                        .spinner {
                                height: 30px;
                                width: 30px;
                                margin: 20px 0 0 20px;
                                display: inline-block;
                                vertical-align: top;

                                -webkit-animation: rotation .8s linear infinite;
                                -moz-animation: rotation .8s linear infinite;
                                -o-animation: rotation .8s linear infinite;
                                animation: rotation 0.8s linear infinite;

                                border-left: 5px solid rgb(235, 235, 235);
                                border-right: 5px solid rgb(235, 235, 235);
                                border-bottom: 5px solid rgb(235, 235, 235);
                                border-top: 5px solid rgb(120, 120, 120);

                                border-radius: 100%;
                                background-color: rgb(189, 215, 46);
                        }

                        @-webkit-keyframes rotation {
                                from {
                                        -webkit-transform: rotate(0deg);
                                }
                                to {
                                        -webkit-transform: rotate(360deg);
                                }
                        }

                        @-moz-keyframes rotation {
                                from {
                                        -moz-transform: rotate(0deg);
                                }
                                to {
                                        -moz-transform: rotate(360deg);
                                }
                        }

                        @-o-keyframes rotation {
                                from {
                                        -o-transform: rotate(0deg);
                                }
                                to {
                                        -o-transform: rotate(360deg);
                                }
                        }

                        @keyframes rotation {
                                from {
                                        transform: rotate(0deg);
                                }
                                to {
                                        transform: rotate(360deg);
                                }
                        }

                        #status {
                                display: inline-block;
                                vertical-align: top;
                                margin-top: 30px;
                                margin-left: 20px;
                                font-weight: bold;
                                color: rgb(120, 120, 120);
                        }

                        #progress {
                                height: 20px;
                                width: 300px;
                        }

                        #output {
                                width: 100%;
                                height: 200px;
                                margin: 10px auto 0;
                                border-left: 0;
                                border-right: 0;
                                padding-left: 0;
                                padding-right: 0;
                                display: block;
                                background-color: black;
                                color: white;
                                font-family: 'Lucida Console', Monaco, monospace;
                                outline: none;
                        }
                        #touch-controls {
                                position: fixed;
                                bottom: 20px;
                                width: 100%;
                                display: flex;
                                justify-content: space-between;
                                align-items: flex-end;
                                padding: 0 10px;
                                z-index: 9999;
                                user-select: none;
                                pointer-events: none;
                        }
                        
                        .joystick-container {
                                position: relative;
                                width: 140px;
                                height: 140px;
                                background: rgba(255,255,255,0.3);
                                border: 3px solid rgba(0,0,0,0.3);
                                border-radius: 50%;
                                pointer-events: auto;
                                display: flex;
                                align-items: center;
                                justify-content: center;
                        }
                        
                        .joystick-knob {
                                position: relative;
                                width: 60px;
                                height: 60px;
                                background: rgba(255,255,255,0.8);
                                border: 3px solid rgba(0,0,0,0.4);
                                border-radius: 50%;
                                cursor: grab;
                                touch-action: none;
                                transition: none;
                        }
                        
                        .joystick-knob:active {
                                cursor: grabbing;
                                background: rgba(255,255,255,1);
                        }
                        
                        .dpad-container {
                                position: relative;
                                width: 130px;
                                height: 130px;
                                pointer-events: auto;
                        }
                        
                        .action-buttons {
                                display: flex;
                                flex-direction: column;
                                align-items: center;
                                gap: 10px;
                                pointer-events: auto;
                        }
                        
                        .action-row {
                                display: flex;
                                gap: 15px;
                                align-items: center;
                        }
                        
                        .dpad-btn {
                                position: absolute;
                                width: 45px;
                                height: 45px;
                                background: rgba(255,255,255,0.7);
                                border: 3px solid rgba(0,0,0,0.3);
                                border-radius: 8px;
                                font-size: 1.8rem;
                                color: black;
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                touch-action: none;
                                -webkit-tap-highlight-color: transparent;
                        }
                        
                        .dpad-btn:active {
                                background: rgba(255,255,255,0.9);
                                transform: scale(0.95);
                        }
                        
                        .dpad-up { top: 0; left: 42px; }
                        .dpad-down { bottom: 0; left: 42px; }
                        .dpad-left { top: 42px; left: 0; }
                        .dpad-right { top: 42px; right: 0; }
                        
                        .action-btn {
                                width: 70px;
                                height: 70px;
                                background: rgba(255,255,255,0.7);
                                border: 3px solid rgba(0,0,0,0.3);
                                border-radius: 50%;
                                font-size: 1.8rem;
                                font-weight: bold;
                                color: black;
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                touch-action: none;
                                -webkit-tap-highlight-color: transparent;
                        }
                        
                        .action-btn:active {
                                background: rgba(255,255,255,0.9);
                                transform: scale(0.95);
                        }
                        
                        .menu-btn {
                                width: 80px;
                                height: 40px;
                                background: rgba(255,255,255,0.6);
                                border: 3px solid rgba(0,0,0,0.3);
                                border-radius: 20px;
                                font-size: 1.0rem;
                                color: black;
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                touch-action: none;
                                -webkit-tap-highlight-color: transparent;
                        }
                        
                        .menu-btn:active {
                                background: rgba(255,255,255,0.9);
                        }
                </style>

<script>
function updateGamepadInfo() {
    const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
    const infoDiv = document.getElementById('gamepad-info');
    const connectedPads = Array.from(gamepads).filter(gp => gp);
    
    if (connectedPads.length === 0) {
        infoDiv.textContent = 'No controllers connected';
    } else {
        const names = connectedPads.map((gp, i) => `#${i+1}: ${gp.id}`).join(', ');
        infoDiv.textContent = `Controllers (${connectedPads.length}): ${names}`;
    }

    requestAnimationFrame(updateGamepadInfo);
}

// start updating info
updateGamepadInfo();
</script>

        <script>
                const buttons = {
                        'btn-up': 'ArrowUp',
                        'btn-down': 'ArrowDown',
                        'btn-left': 'ArrowLeft',
                        'btn-right': 'ArrowRight',
                        'btn-jump': 'KeyA',
                        'btn-w': 'KeyW',
                        'btn-b': 'KeyB',
                        'btn-escape': 'Escape'
                };

                for (const [btnId, key] of Object.entries(buttons)) {
                        const btn = document.getElementById(btnId);
                        if (!btn) continue;
                        btn.addEventListener('touchstart', e => {
                                e.preventDefault();
                                simulateKeyDown(key);
                        }, {passive: false});
                        btn.addEventListener('touchmove', e => {
                                e.preventDefault();
                        }, { passive: false });
                        
                        btn.addEventListener('mousedown', e => {
                                e.preventDefault();
                                simulateKeyDown(key);
                        });

                        btn.addEventListener('touchend', e => {
                                e.preventDefault();
                                simulateKeyUp(key);
                        }, {passive: false});
                        btn.addEventListener('mouseup', e => {
                                e.preventDefault();
                                simulateKeyUp(key);
                        });
                }

                const keysPressed = new Set();
                function simulateKeyDown(code) {
                        if (keysPressed.has(code)) return;
                        keysPressed.add(code);

                        const key = codeToKey(code);

                        const event = new KeyboardEvent('keydown', {
                                key: key,
                                code: code,
                                keyCode: eventKeyCode(code),
                                which: eventKeyCode(code),
                                bubbles: true,
                                cancelable: true,
                                composed: true
                        });

                        window.dispatchEvent(event);
                }

                function simulateKeyUp(code) {
                        if (!keysPressed.has(code)) return;
                        keysPressed.delete(code);

                        const key = codeToKey(code);

                        const event = new KeyboardEvent('keyup', {
                                key: key,
                                code: code,
                                keyCode: eventKeyCode(code),
                                which: eventKeyCode(code),
                                bubbles: true,
                                cancelable: true,
                                composed: true
                        });

                        window.dispatchEvent(event);
                }

                function eventKeyCode(code) {
                        switch(code) {
                                case 'ArrowUp': return 38;
                                case 'ArrowDown': return 40;
                                case 'ArrowLeft': return 37;
                                case 'ArrowRight': return 39;
                                case 'KeyA': return 65;
                                        case 'KeyW': return 87;
                                case 'Escape': return 27;
                                default: return 0;
                        }
                }       

                function codeToKey(code) {
                        if (code.startsWith('Key')) {
                                return code[3].toLowerCase();
                        }
                        return code;
                }
        

        </script>
        <script>
  // ✅ Gamepad + W button code goes here
  const gamepadButtonMap = {
    0: "KeyA",
    1: "KeyB",
    2: "KeyX",
    3: "KeyW",   // map Y button to W
    9: "Escape",
    12: "ArrowUp",
    13: "ArrowDown",
    14: "ArrowLeft",
    15: "ArrowRight"
  };

  const gamepadAxesMap = {
    0: ["ArrowLeft", "ArrowRight"],
    1: ["ArrowUp", "ArrowDown"],
  };

  const pressedButtons = new Set();

  function pollGamepads() {
    const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const gp of gamepads) {
      if (!gp) continue;

      // Handle buttons
      gp.buttons.forEach((btn, index) => {
        const key = gamepadButtonMap[index];
        if (!key) return;
        if (btn.pressed && !pressedButtons.has(key)) {
          simulateKeyDown(key);
          pressedButtons.add(key);
        } else if (!btn.pressed && pressedButtons.has(key)) {
          simulateKeyUp(key);
          pressedButtons.delete(key);
        }
      });

      // Handle sticks
      gp.axes.forEach((value, index) => {
        const mapping = gamepadAxesMap[index];
        if (!mapping) return;
        const [neg, pos] = mapping;

        if (value < -0.5) {
          if (!pressedButtons.has(neg)) {
            simulateKeyDown(neg);
            pressedButtons.add(neg);
          }
        } else if (pressedButtons.has(neg)) {
          simulateKeyUp(neg);
          pressedButtons.delete(neg);
        }

        if (value > 0.5) {
          if (!pressedButtons.has(pos)) {
            simulateKeyDown(pos);
            pressedButtons.add(pos);
          }
        } else if (pressedButtons.has(pos)) {
          simulateKeyUp(pos);
          pressedButtons.delete(pos);
        }
      });
    }
    requestAnimationFrame(pollGamepads);
  }

  window.addEventListener("gamepadconnected", e => {
    console.log("Gamepad connected:", e.gamepad);
    pollGamepads();
  });

  window.addEventListener("gamepaddisconnected", e => {
    console.log("Gamepad disconnected:", e.gamepad);
  });

  // W and B buttons are now part of the main touch controls HTML, no need to create dynamically
</script>

<script>
// Virtual Joystick Implementation
class VirtualJoystick {
    constructor(container, knob) {
        this.container = container;
        this.knob = knob;
        this.isDragging = false;
        this.centerX = 0;
        this.centerY = 0;
        this.maxDistance = 40; // Max distance knob can move from center
        this.currentDirection = { up: false, down: false, left: false, right: false };
        
        this.init();
    }
    
    init() {
        // Set initial position
        this.updateCenter();
        
        // Mouse events
        this.knob.addEventListener('mousedown', this.startDrag.bind(this));
        document.addEventListener('mousemove', this.onDrag.bind(this));
        document.addEventListener('mouseup', this.endDrag.bind(this));
        
        // Touch events - use capture to handle before other elements
        this.knob.addEventListener('touchstart', this.startDrag.bind(this), { passive: false, capture: true });
        document.addEventListener('touchmove', this.onDrag.bind(this), { passive: false });
        document.addEventListener('touchend', this.endDrag.bind(this));
        document.addEventListener('touchcancel', this.endDrag.bind(this));
        
        // Resize handler
        window.addEventListener('resize', this.updateCenter.bind(this));
    }
    
    updateCenter() {
        const rect = this.container.getBoundingClientRect();
        this.centerX = rect.left + rect.width / 2;
        this.centerY = rect.top + rect.height / 2;
    }
    
    startDrag(e) {
        e.preventDefault();
        this.isDragging = true;
        this.updateCenter();
    }
    
    onDrag(e) {
        if (!this.isDragging) return;
        
        e.preventDefault();
        
        // Handle multiple touches - find the touch that started the drag
        let clientX, clientY;
        if (e.type.includes('touch')) {
            // Find our touch among multiple touches
            for (let touch of e.touches) {
                // Use the first touch if we can't identify the specific one
                clientX = touch.clientX;
                clientY = touch.clientY;
                break;
            }
            if (!clientX) return; // No touches found
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }
        
        const deltaX = clientX - this.centerX;
        const deltaY = clientY - this.centerY;
        const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
        
        // Constrain knob to circle
        let x = deltaX;
        let y = deltaY;
        
        if (distance > this.maxDistance) {
            x = (deltaX / distance) * this.maxDistance;
            y = (deltaY / distance) * this.maxDistance;
        }
        
        // Update knob position
        this.knob.style.transform = `translate(${x}px, ${y}px)`;
        
        // Calculate directions (with deadzone)
        const deadzone = 10;
        const newDirection = {
            up: y < -deadzone,
            down: y > deadzone,
            left: x < -deadzone,
            right: x > deadzone
        };
        
        // Trigger key events when direction changes
        this.updateDirectionKeys(newDirection);
    }
    
    endDrag(e) {
        if (!this.isDragging) return;
        
        e.preventDefault();
        this.isDragging = false;
        
        // Reset knob position
        this.knob.style.transform = 'translate(0px, 0px)';
        
        // Release all direction keys
        this.updateDirectionKeys({ up: false, down: false, left: false, right: false });
    }
    
    updateDirectionKeys(newDirection) {
        // Release keys that are no longer pressed
        if (this.currentDirection.up && !newDirection.up) {
            simulateKeyUp('ArrowUp');
        }
        if (this.currentDirection.down && !newDirection.down) {
            simulateKeyUp('ArrowDown');
        }
        if (this.currentDirection.left && !newDirection.left) {
            simulateKeyUp('ArrowLeft');
        }
        if (this.currentDirection.right && !newDirection.right) {
            simulateKeyUp('ArrowRight');
        }
        
        // Press keys that are newly pressed
        if (!this.currentDirection.up && newDirection.up) {
            simulateKeyDown('ArrowUp');
        }
        if (!this.currentDirection.down && newDirection.down) {
            simulateKeyDown('ArrowDown');
        }
        if (!this.currentDirection.left && newDirection.left) {
            simulateKeyDown('ArrowLeft');
        }
        if (!this.currentDirection.right && newDirection.right) {
            simulateKeyDown('ArrowRight');
        }
        
        this.currentDirection = newDirection;
    }
}

// Initialize joystick when page loads
document.addEventListener('DOMContentLoaded', function() {
    const container = document.getElementById('joystick-container');
    const knob = document.getElementById('joystick-knob');
    
    if (container && knob) {
        new VirtualJoystick(container, knob);
    }
});

// If DOM is already loaded
if (document.readyState === 'loading') {
    // Do nothing, event listener above will handle it
} else {
    // DOM already loaded
    const container = document.getElementById('joystick-container');
    const knob = document.getElementById('joystick-knob');
    
    if (container && knob) {
        new VirtualJoystick(container, knob);
    }
}
</script>

                <script type="text/javascript">
                        if ('serviceWorker' in navigator) {
                                navigator.serviceWorker.register('sw.js').then(function(registration) {
                                        registration.addEventListener('updatefound', function() {
                                                var installingWorker = registration.installing;
                                                console.log('A new service worker is being installed:', installingWorker);
                                        });
                                }, function(err) {
                                        console.log('ServiceWorker registration failed: ', err);
                                });
                        } else {
                                console.log('ServiceWorker not supported');
                        }

                        var statusElement = document.getElementById('status');
                        var progressElement = document.getElementById('progress');
                        var spinnerElement = document.getElementById('spinner');

                        var Module = {
                                preRun: [],
                                postRun: [],
                                print: (function () {
                                        var element = document.getElementById('output');
                                        if (element) element.value = ''; // clear browser cache
                                        return function (text) {
                                                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                                                // These replacements are necessary if you render to raw HTML
                                                //text = text.replace(/&/g, "&amp;");
                                                //text = text.replace(/</g, "&lt;");
                                                //text = text.replace(/>/g, "&gt;");
                                                //text = text.replace('\n', '<br>', 'g');
                                                console.log(text);
                                                if (element) {
                                                        element.value += text + "\n";
                                                        element.scrollTop = element.scrollHeight; // focus on bottom
                                                }
                                        };
                                })(),
                                printErr: function (text) {
                                        if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                                        console.error(text);
                                },
                                canvas: (function () {
                                        var canvas = document.getElementById('canvas');

                                        // As a default initial behavior, pop up an alert when webgl context is lost. To make your
                                        // application robust, you may want to override this behavior before shipping!
                                        // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
                                        canvas.addEventListener("webglcontextlost", function (e) {
                                                alert('WebGL context lost. You will need to reload the page.');
                                                e.preventDefault();
                                        }, false);

                                        return canvas;
                                })(),
                                setStatus: function (text) {
                                        if (!Module.setStatus.last) Module.setStatus.last = {time: Date.now(), text: ''};
                                        if (text === Module.setStatus.last.text) return;
                                        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                                        var now = Date.now();
                                        if (m && now - Module.setStatus.last.time < 30) return; // if this is a progress update, skip it if too soon
                                        Module.setStatus.last.time = now;
                                        Module.setStatus.last.text = text;
                                        if (m) {
                                                text = m[1];
                                                progressElement.value = parseInt(m[2]) * 100;
                                                progressElement.max = parseInt(m[4]) * 100;
                                                progressElement.hidden = false;
                                                spinnerElement.hidden = false;
                                        } else {
                                                progressElement.value = null;
                                                progressElement.max = null;
                                                progressElement.hidden = true;
                                                if (!text) spinnerElement.style.display = 'none';
                                        }
                                        statusElement.innerHTML = text;
                                },
                                totalDependencies: 0,
                                monitorRunDependencies: function (left) {
                                        this.totalDependencies = Math.max(this.totalDependencies, left);
                                        Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
                                }
                        };
                        Module.setStatus('Downloading...');
                        window.onerror = function () {
                                Module.setStatus('Exception thrown, see JavaScript console');
                                spinnerElement.style.display = 'none';
                                Module.setStatus = function (text) {
                                        if (text) Module.printErr('[post-exception status] ' + text);
                                };
                        };
                </script>
